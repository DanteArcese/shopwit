{% extends "web/base.html" %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block canonical %}{% endblock %}
{% block title %}Sign in - UnitPricer{% endblock %}
{% block main %}
<h1>Sign in to UnitPricer</h1>
<p>Sign in as <strong>{{ email }}</strong>?</p>
<form class="account-form" method="post" action="{% url 'accounts:magic' token %}">
  {% csrf_token %}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
