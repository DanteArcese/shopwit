name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unitpricer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/unitpricer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/dantearcese/unitpricer
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: unitpricer:ci
      - name: Build backup image
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          load: true
          tags: unitpricer-backup:ci
      - name: Smoke-check production settings
        # check --deploy does not connect to the database; the URL is a dummy.
        run: >-
          docker run --rm
          -e DJANGO_DEBUG=0
          -e DJANGO_SECRET_KEY=ci-smoke-only-not-a-secret-ci-smoke-only-not-a-secret
          -e DJANGO_ALLOWED_HOSTS=unitpricer.com,www.unitpricer.com,beta.unitpricer.com
          -e UNITPRICER_PUBLIC_HOST=unitpricer.com
          -e UNITPRICER_APP_HOST=beta.unitpricer.com
          -e UNITPRICER_PUBLIC_URL=https://unitpricer.com
          -e UNITPRICER_SITE_URL=https://unitpricer.com
          -e CF_ACCESS_TEAM_DOMAIN=unitpricer.cloudflareaccess.com
          -e CF_ACCESS_AUD=ci-smoke-aud
          -e DATABASE_URL=postgres://x:y@localhost:5432/z
          unitpricer:ci
          python manage.py check --deploy --fail-level WARNING
      - name: Validate production compose file
        # Dummy values only; this checks interpolation and structure, nothing is started.
        run: |
          touch app.env  # env_file must exist; contents are not needed here
          docker compose -f compose.prod.yaml config -q
        env:
          UNITPRICER_IMAGE_TAG: sha-ci
          POSTGRES_PASSWORD: ci-dummy
          TUNNEL_TOKEN: ci-dummy
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push app image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dantearcese/unitpricer:sha-${{ github.sha }}
            ghcr.io/dantearcese/unitpricer:main
      - name: Push backup image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          push: true
          tags: |
            ghcr.io/dantearcese/unitpricer-backup:sha-${{ github.sha }}
            ghcr.io/dantearcese/unitpricer-backup:main
