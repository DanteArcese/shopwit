[project]
name = "unitpricer"
version = "0.1.0"
description = "Open-source grocery and household price-per-unit comparison"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "dj-database-url>=3.1.2",
    "django~=5.2",
    "httpx>=0.28.1",
    "pint>=0.26.2",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-p tests.postgres_plugin"
