#cloud-config
# Droplet bootstrap for UnitPricer (Ubuntu 24.04). Nothing sensitive belongs here.
users:
  - default
  - name: deploy
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

ssh_pwauth: false
disable_root: true

swap:
  filename: /swapfile
  size: 1G

package_update: true
package_upgrade: true
packages:
  - ufw
  - unattended-upgrades
  - ca-certificates
  - curl

write_files:
  - path: /etc/ssh/sshd_config.d/60-unitpricer.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      AllowUsers deploy
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"log-driver": "local", "log-opts": {"max-size": "10m", "max-file": "5"}}
  - path: /etc/apt/apt.conf.d/52unitpricer-upgrades
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "08:00";

runcmd:
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw --force enable
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy -m 750 /srv/unitpricer
  - systemctl restart ssh
