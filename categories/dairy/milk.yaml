name: Milk
dimension: volume
match:
  include: ["milk"]
  exclude: [almond, oat, soy, coconut, chocolate, condensed, evaporated, powdered, milk chocolate, cashew, rice, hemp, pea, macadamia, flax, peanut, flaxseed, ricotta, magnesia, milk-bone, dry milk, variety pack, variety,
    # Other dairy products and drinks made with milk (#88).
    yogurt, yoghurt, kefir, cultured, cheese, buttermilk, butter milk, ice cream,
    shake, milkshake, protein shake, muscle milk, drink, beverage,
    latte, cold brew, espresso, coffee, tea, malted,
    # Flavored milks (like chocolate above) and non-dairy "milks".
    vanilla, strawberry, strawberries, banana, horchata, pistachio, choco,
    dairy-free, dairy free, plant-based, plant based, animal free, animal-free,
    # Candy, desserts and herbal products named after milk.
    candy, milk duds, truffles, choceur, crunch, sea salt, cookies, bars, thistle, traditional medicinals]
attributes:
  fat:
    type: enum
    values: [skim, "1", "2", whole]
    patterns: ['(?<![\d.])([12])\s?%']
    synonyms:
      skim: [skim, fat free, nonfat]
      "1": [low fat, lowfat]
      "2": [reduced fat]
      whole: [whole milk, vitamin d milk]
  organic:
    type: bool
    synonyms: {true: [organic, o organics]}
    off_label: en:organic
    absent: false
  lactose_free:
    type: bool
    synonyms: {true: [lactose free, lactose-free, lactaid]}
    absent: false
  ultra_filtered:
    type: bool
    synonyms: {true: [ultra-filtered, ultra filtered, fairlife]}
    absent: false
comparison:
  default: per_volume
search: ["2% milk", "whole milk", "skim milk", "organic milk"]
