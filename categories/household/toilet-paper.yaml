name: Toilet Paper
parent: household/paper-goods
match:
  include: ["toilet paper", "bath tissue", "bathroom tissue"]
  exclude: ["wipes", "flushable wipe", "holder"]
dimension: paper
attributes:
  ply:
    type: int
    values: [1, 2, 3]
    patterns: ['(?<![\d.])([123])[- ]?ply']
    synonyms:
      1: ["single ply"]
      2: ["double ply"]
comparison:
  default: area_x_ply
  alternates: [per_100_sheets, per_roll]
search: ["toilet paper"]
