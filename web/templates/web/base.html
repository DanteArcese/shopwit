{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UnitPricer{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
  <script src="{% static 'web/htmx.min.js' %}" defer></script>
  <script src="{% static 'web/app.js' %}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{% url 'home' %}">UnitPricer</a>
    <form class="search" action="{% url 'search' %}" method="get" role="search">
      <input type="search" name="q" aria-label="Search products" placeholder="Search products" value="{{ q|default:'' }}">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>
    {% if has_outbound %}<p class="affiliate-banner" role="note">We may earn a commission when you buy through links on this site. It never affects ranking. <a href="{% url 'disclosure' %}">Details</a></p>{% endif %}
    {% block main %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a href="{% url 'disclosure' %}">Disclosure</a>
    <a href="{% url 'settings' %}?next={{ request.get_full_path|urlencode }}">Settings</a>
  </footer>
</body>
</html>
